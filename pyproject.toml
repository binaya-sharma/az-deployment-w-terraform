[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics"
version = "0.1.0"
description = "Small Databricks serverless medallion pipeline used to verify deployment and governance."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "yamllint>=1.37,<2",
]

[project.scripts]
retail-pipeline = "retail_analytics.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["retail_analytics*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["retail_analytics"]
strict = true

[[tool.mypy.overrides]]
module = "pyspark.*"
ignore_missing_imports = true
