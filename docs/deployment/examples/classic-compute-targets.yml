# Documentation-only scaffold. This file is not included by databricks.yml.
# Use it only after the job tasks move from serverless environment_key to
# job_cluster_key: shared_job_cluster.
targets:
  dev:
    resources:
      jobs:
        retail_medallion_smoke_test:
          job_clusters:
            - job_cluster_key: shared_job_cluster
              new_cluster:
                spark_version: <approved-lts-runtime>
                node_type_id: <small-dev-node-type>
                policy_id: <dev-cluster-policy-id>
                data_security_mode: SINGLE_USER
                autoscale:
                  min_workers: 1
                  max_workers: 2

  qual:
    resources:
      jobs:
        retail_medallion_smoke_test:
          job_clusters:
            - job_cluster_key: shared_job_cluster
              new_cluster:
                spark_version: <approved-lts-runtime>
                node_type_id: <qual-node-type>
                policy_id: <qual-cluster-policy-id>
                data_security_mode: SINGLE_USER
                autoscale:
                  min_workers: 1
                  max_workers: 4

  prod:
    resources:
      jobs:
        retail_medallion_smoke_test:
          job_clusters:
            - job_cluster_key: shared_job_cluster
              new_cluster:
                spark_version: <approved-lts-runtime>
                node_type_id: <prod-node-type>
                policy_id: <prod-cluster-policy-id>
                data_security_mode: SINGLE_USER
                autoscale:
                  min_workers: 2
                  max_workers: 8
